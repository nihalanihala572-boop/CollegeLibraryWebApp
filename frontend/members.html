
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Members - College Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .table-box {
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 15px;
            overflow-x: auto;
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #667eea;
            color: white;
        }

        tr:hover {
            background: #f2f2f2;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>👥 Members Details</h1>

        <div class="table-box">

            <h2>Library Members</h2>

            <table>

                <thead>
                    <tr>
                        <th>Member ID</th>
                        <th>Member Name</th>
                        <th>Department</th>
                        <th>Email</th>
                        <th>Phone</th>
                    </tr>
                </thead>

                <tbody id="membersTable">
                    <tr>
                        <td colspan="5">Loading members...</td>
                    </tr>
                </tbody>

            </table>

        </div>

        <a href="home.html" class="back-btn">
            ⬅ Back to Home
        </a>

    </div>

    <script>
        async function loadMembers() {

            try {
                const response = await fetch("http://localhost:5000/api/members");

                if (!response.ok) {
                    throw new Error("Failed to fetch members");
                }

                const members = await response.json();
                const table = document.getElementById("membersTable");

                table.innerHTML = "";

                if (members.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="5">No members found.</td>
                        </tr>
                    `;
                    return;
                }

                members.forEach(member => {
                    table.innerHTML += `
                        <tr>
                            <td>${member.member_id}</td>
                            <td>${member.member_name}</td>
                            <td>${member.department || "N/A"}</td>
                            <td>${member.email || "N/A"}</td>
                            <td>${member.phone || "N/A"}</td>
                        </tr>
                    `;
                });

            } catch (error) {

                console.error("Error:", error);

                document.getElementById("membersTable").innerHTML = `
                    <tr>
                        <td colspan="5" class="error">
                            Failed to load members. Please check your backend.
                        </td>
                    </tr>
                `;
            }
        }

        loadMembers();
    </script>

</body>

</html>
